name: rates
on:
  schedule:
    - cron: "0 6 2 1,4,7,10 *"   # 2 Jan / 2 Apr / 2 Jul / 2 Oct, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline rates
      - run: python -m pipeline fx
      - run: bash scripts/publish.sh "rates $(date -u +%F)"
