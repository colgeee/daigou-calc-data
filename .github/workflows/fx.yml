name: fx
on:
  schedule:
    - cron: "5 17 * * *"      # daily 17:05 UTC, after the ECB's 16:00 CET publication
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline fx
      - name: keep the current rates file alongside the new fx file
        run: |
          git fetch origin gh-pages:gh-pages || true
          for f in rates.json.gz rates.json; do
            if git cat-file -e "gh-pages:v1/$f" 2>/dev/null; then
              git show "gh-pages:v1/$f" > "out/v1/$f"
            fi
          done
      - run: bash scripts/publish.sh "fx $(date -u +%F)"
